<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espacio Río · Plano Interactivo</title>
  <style>
    :root {
      --bg: #111210;
      --line: #3a3932;
      --line2: #555247;
      --lot: #796c5b;
      --lot2: #6f6353;
      --lot-hover: #9b8a72;
      --text: #d9d2c6;
      --muted: #77736a;
      --green: #68745b;
      --green2: #9cae8c;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif
    }

    body {
      overflow-x: hidden
    }

    .wrap {
      min-height: 100vh;
      padding: 14px 18px 12px;
      display: flex;
      flex-direction: column
    }

    .topbar {
      height: 44px;
      border-top: 1px solid #292a27;
      border-bottom: 1px solid #242522;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5px;
      color: #706d65;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .canvas {
      position: relative;
      flex: 1;
      min-height: 610px;
      margin-top: 2px
    }

    svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .label {
      fill: #aaa49a;
      font-size: 10px;
      letter-spacing: 1.8px
    }

    .small {
      fill: #827d73;
      font-size: 8px;
      letter-spacing: 1.7px
    }

    .lot {
      fill: var(--lot);
      stroke: #8d806e;
      stroke-width: 1;
      cursor: pointer;
      transition: fill .18s, filter .18s, stroke .18s;
    }

    .lot:hover,
    .lot.active {
      fill: var(--lot-hover);
      stroke: #c1ad90;
      filter: drop-shadow(0 0 7px rgba(201, 177, 140, .18))
    }

    .lot-number {
      fill: #eee8dd;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .3px;
      pointer-events: none
    }

    .lot-area {
      fill: #d2c9bc;
      font-size: 8.5px;
      pointer-events: none
    }

    .feature {
      fill: #3c3933;
      stroke: #605b51;
      stroke-width: 1
    }

    .feature-light {
      fill: #514a40;
      stroke: #6d6558;
      stroke-width: 1
    }

    .dashed {
      fill: none;
      stroke: #4b4940;
      stroke-width: 1;
      stroke-dasharray: 7 5
    }

    .thin {
      fill: none;
      stroke: #3c3c36;
      stroke-width: 1
    }

    .parking {
      fill: #252522;
      stroke: #46443d;
      stroke-width: 1
    }

    .tree {
      fill: #293128;
      stroke: #55604b;
      stroke-width: 1
    }

    .tree-dot {
      fill: #354031;
      stroke: #68755b;
      stroke-width: 1
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .58);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-backdrop.open {
      display: flex
    }

    .modal {
      width: min(420px, calc(100vw - 32px));
      background: #1a1a17;
      border: 1px solid #454139;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .55);
      padding: 25px;
    }

    .modal-kicker {
      font-size: 9px;
      letter-spacing: 3px;
      color: #827d72;
      text-transform: uppercase
    }

    .modal h2 {
      margin: 8px 0 5px;
      font-size: 28px;
      font-weight: 400;
      color: #eee7dc
    }

    .modal p {
      margin: 0;
      color: #9f9a90;
      font-size: 13px;
      line-height: 1.6
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #3b3932;
      margin-top: 20px
    }

    .modal-cell {
      background: #1a1a17;
      padding: 12px
    }

    .modal-cell span {
      display: block;
      color: #77736b;
      font-size: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 5px
    }

    .modal-cell strong {
      font-size: 13px;
      font-weight: 400;
      color: #ddd5c8
    }

    .close {
      margin-top: 20px;
      background: transparent;
      color: #aaa398;
      border: 1px solid #514d44;
      padding: 9px 16px;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer
    }

    .close:hover {
      background: #292822;
      color: #fff
    }

    @media(max-width:800px) {
      .topbar {
        font-size: 8px;
        letter-spacing: 2px
      }

      .canvas {
        min-height: 500px;
        overflow: auto
      }

      svg {
        min-width: 900px
      }
    }
  </style>
</head>

  <script>
    (() => {
      const modal = document.querySelector('#modal');
      const title = document.querySelector('#mTitle');
      const area = document.querySelector('#mArea');
      const desc = document.querySelector('#mDesc');

      document.querySelectorAll('.lot').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.lot').forEach(x => x.classList.remove('active'));
          el.classList.add('active');
          const id = el.dataset.id;
          title.textContent = `Local ${id}`;
          area.textContent = el.dataset.area || 'Consultar';
          desc.textContent = `Ficha de la unidad ${id}. Haz clic en otra unidad para cambiar la selección.`;
          modal.classList.add('open');
        });
      });

      document.querySelector('#close').addEventListener('click', () => {
        modal.classList.remove('open');
        document.querySelectorAll('.lot').forEach(x => x.classList.remove('active'));
      });

      modal.addEventListener('click', e => {
        if (e.target === modal) modal.classList.remove('open');
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') modal.classList.remove('open');
      });
    })();
  </script>
